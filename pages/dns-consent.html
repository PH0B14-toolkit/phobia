<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Network Access</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#eef2f7;color:#1f2937;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:28px 24px;box-shadow:0 10px 40px rgba(0,0,0,.1);border:1px solid #e5e7eb;text-align:center}
h1{font-size:19px;font-weight:600;color:#111827;margin-bottom:8px}
p{font-size:13.5px;color:#6b7280;line-height:1.55;margin-bottom:20px}
.btn{display:block;width:100%;padding:14px;border-radius:10px;border:0;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px;transition:background .15s}
.btn-yes{background:#10b981;color:#fff}
.btn-yes:active{background:#059669}
.btn-no{background:#e5e7eb;color:#374151}
.btn-no:active{background:#d1d5db}
.note{font-size:11.5px;color:#9ca3af;margin-top:14px;min-height:18px}
</style>
</head>
<body>
<div class="card">
<h1>Network Access Request</h1>
<p>This Wi-Fi network is asking for permission to configure DNS. Choose how to proceed.</p>
<button class="btn btn-yes" onclick="choose('allow')">Enable DNS configuration</button>
<button class="btn btn-no" onclick="choose('block')">Block and disconnect</button>
<div class="note" id="note"></div>
</div>
<script>
function choose(choice){
  document.getElementById('note').textContent = 'Submitting...';
  fetch('/dns-choice?c=' + choice).then(function(){
    document.getElementById('note').textContent =
      choice === 'allow' ? 'Enabled. You may close this window.' : 'Blocked. You may close this window.';
  }).catch(function(){
    document.getElementById('note').textContent = 'Submitted.';
  });
}
</script>
</body>
</html>
